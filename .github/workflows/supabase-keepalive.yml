name: Supabase Keepalive

on:
  schedule:
    # Runs daily at 09:00 UTC
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          URL="${SUPABASE_URL:-${VITE_SUPABASE_URL:-}}"
          ANON_KEY="${SUPABASE_ANON_KEY:-${VITE_SUPABASE_ANON_KEY:-}}"

          if [[ -z "${URL:-}" || -z "${ANON_KEY:-}" ]]; then
            echo "Missing required secrets. Add either:"
            echo "- SUPABASE_URL and SUPABASE_ANON_KEY"
            echo "or"
            echo "- VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY"
            exit 1
          fi

          PING_URL="${URL%/}/rest/v1/"

          set +e
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2 \
            -H "apikey: ${ANON_KEY}" \
            -H "Authorization: Bearer ${ANON_KEY}" \
            "$PING_URL")
          CURL_EXIT=$?
          set -e

          if [[ "$CURL_EXIT" -ne 0 ]]; then
            echo "curl failed (exit ${CURL_EXIT}) while reaching ${PING_URL}"
            exit 1
          fi

          echo "Supabase ping HTTP status: ${HTTP_CODE}"

          # 2xx/3xx/4xx confirms endpoint reachability and activity.
          if [[ "$HTTP_CODE" =~ ^[234] ]]; then
            exit 0
          fi

          echo "Ping failed with unexpected HTTP status: ${HTTP_CODE}"
          exit 1
